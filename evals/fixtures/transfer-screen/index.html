<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send money</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7f8; color: #222d3e; }
  .screen { max-width: 440px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .top h1 { font-size: 22px; margin: 0; }
  .close { width: 20px; height: 20px; border: 0; background: none; padding: 0; color: #535d6b; cursor: pointer; }
  .card { background: #ffffff; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(15,17,19,.08); }
  .balance { font-size: 13px; color: #9aa0a6; margin: 0 0 4px; }
  .amount { font-size: 34px; font-weight: 700; color: #dc2626; margin: 0; font-variant-numeric: tabular-nums; }
  .fee { font-size: 11px; color: #a6aab0; margin-top: 2px; }
  input { width: 100%; box-sizing: border-box; border: 1px solid #dee0e2; border-radius: 10px; padding: 13px 12px; font-size: 16px; margin-top: 10px; }
  input.invalid { border-color: #dc2626; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .primary { background: #4338ca; color: #ffffff; }
  .icon-send { width: 52px; flex: 0 0 52px; background: #4338ca; color: #fff; border: 0; border-radius: 12px; cursor: pointer; }
  .notice { font-size: 13px; color: #b91c1c; margin-top: 8px; }
  .recent { list-style: none; padding: 0; margin: 0; }
  .recent li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eeeff0; font-size: 15px; }
  .muted { color: #a6aab0; }
</style>
</head>
<body>
<main class="screen">
  <div class="top">
    <h1>Send money</h1>
    <button class="close" onclick="history.back()"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2"/></svg></button>
  </div>

  <section class="card">
    <p class="balance">Available: ₺12.480,00</p>
    <p class="amount">-₺2.500,00</p>
    <p class="fee">Transfer fee ₺14,90 applies. Exchange rate may vary.</p>
  </section>

  <section class="card">
    <input type="text" placeholder="Recipient name">
    <input type="text" class="invalid" placeholder="IBAN" value="TR33 0006 1005 1978 6457 8413">
    <input type="text" placeholder="Description (optional)">
    <p class="notice">Error 4012 occurred.</p>
    <div class="row">
      <button class="btn primary">Save as template</button>
      <button class="btn primary">Make payment</button>
      <button class="icon-send"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 12l18-9-7 18-2-7-9-2z" fill="currentColor"/></svg></button>
    </div>
  </section>

  <section class="card">
    <h3>Recent transfers</h3>
    <ul class="recent">
      <li><span>Ayşe Yılmaz</span><span class="muted">-₺450,00</span></li>
      <li><span>Mert Kaya</span><span class="muted">-₺1.200,00</span></li>
    </ul>
  </section>
</main>
</body>
</html>
